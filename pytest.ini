[pytest]
# 正式自动化测试套件仅位于 tests/ 目录。
# 根目录 / scripts / tools 下以 test_ 开头的文件均为开发调试或手动验证脚本
# （微信解密、frida、内存读取、压力/人设验证等，多为顶层直接执行、sys.exit 或
# 创建 QApplication），不作为 pytest 用例收集；它们仍可用 `python <脚本>` 独立运行。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: 慢集成 / 端到端测试（首次后台索引或驱动真实主窗口，耗时明显，快速回归可用 -m "not slow" 排除）
