<!DOCTYPE html>
<!-- 网页版微信聊天区 DOM 样本（P11 测试用，方向已知）
     recv 块=对方(received)，me 块=我(sent)。
     共 4 条：在吗(recv) / 在的怎么了(sent) / 晚上一起吃饭吗(recv) / 好呀几点(sent)
-->
<div class="chat">
  <div class="message">
    <div class="bubble">
      <span class="plain">在吗</span>
    </div>
  </div>
  <div class="message me">
    <div class="bubble">
      <span class="plain">在的怎么了</span>
    </div>
  </div>
  <div class="message">
    <div class="bubble">
      <span class="plain">晚上一起吃饭吗</span>
    </div>
  </div>
  <div class="message me">
    <div class="bubble">
      <span class="plain">好呀几点</span>
    </div>
  </div>
</div>
