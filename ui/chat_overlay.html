<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LoveAI 代聊</title>
    <style>
        /* 方案B Raycast 毛玻璃：珊瑚红强调 + 半透明深底 + backdrop blur */
        :root {
            --bg-primary: rgba(18, 16, 14, 0.55);
            --bg-secondary: rgba(26, 23, 20, 0.55);
            --bg-card: rgba(34, 29, 24, 0.55);
            --bg-hover: rgba(42, 36, 29, 0.6);
            --text-primary: #e8dcc4;
            --text-secondary: #a89880;
            --text-muted: #6b5f4d;
            --gold-primary: #ff6363;
            --gold-light: #ff8a8a;
            --gold-dark: #d64545;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(255, 99, 99, 0.2);
            --emotion-positive: #4ade80;
            --emotion-neutral: #fbbf24;
            --emotion-negative: #f87171;
            --emotion-implied: #c084fc;
            --gradient-gold: linear-gradient(135deg, #ff8a8a 0%, #ff6363 50%, #d64545 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 360px; height: 600px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: rgba(18, 16, 14, 0.55);
            backdrop-filter: blur(40px) saturate(160%);
            -webkit-backdrop-filter: blur(40px) saturate(160%);
            color: var(--text-primary);
            font-size: 13px;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* 顶部栏 */
        .overlay-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: rgba(26, 23, 20, 0.45);
            border-bottom: 1px solid var(--border-gold);
            gap: 8px;
        }
        .overlay-header .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--gold-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .overlay-header .name { flex: 1; font-weight: 600; font-size: 14px; }
        .wx-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--emotion-negative);
        }
        .wx-dot.online {
            background: var(--emotion-positive);
            box-shadow: 0 0 6px var(--emotion-positive);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

        /* 弹幕流（占大部分） */
        .dm-area {
            height: 380px;
            overflow-y: auto;
            padding: 10px;
            font-family: "Consolas", monospace;
            font-size: 11px;
            line-height: 1.7;
            background: transparent;
        }
        .dm-line { padding: 1px 0; }
        .dm-line .t { color: var(--text-muted); margin-right: 4px; }
        .dm-info    { color: var(--text-secondary); }
        .dm-success { color: var(--emotion-positive); }
        .dm-warning { color: var(--emotion-neutral); }
        .dm-error   { color: var(--emotion-negative); }
        .dm-empty { color: var(--text-muted); text-align: center; padding: 20px; }

        /* 底部回复建议 */
        .reply-area {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(34, 29, 24, 0.55);
            border-top: 1px solid var(--border-gold);
            padding: 10px;
        }
        .reply-label {
            font-size: 11px;
            color: var(--gold-primary);
            margin-bottom: 6px;
        }
        .reply-text {
            background: rgba(18, 16, 14, 0.55);
            border-left: 3px solid var(--gold-primary);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 8px;
            white-space: pre-wrap;
        }
        .reply-text.empty { color: var(--text-muted); }
        .btn-row { display: flex; gap: 6px; }
        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease;
        }
        .btn-fill {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            color: #12100e;
        }
        .btn-copy {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        button:active { opacity: 0.85; }
    </style>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>

    <!-- 顶部 -->
    <div class="overlay-header">
        <div class="avatar">👤</div>
        <div class="name" id="personName">未选择</div>
        <span class="wx-dot" id="wxDot"></span>
    </div>

    <!-- 弹幕流 -->
    <div class="dm-area" id="dmArea">
        <div class="dm-empty">等待分析消息...</div>
    </div>

    <!-- 底部回复建议 -->
    <div class="reply-area">
        <div class="reply-label">💡 AI 建议回复</div>
        <div class="reply-text empty" id="replyText">暂无回复</div>
        <div class="btn-row">
            <button class="btn-copy" id="copyBtn">复制</button>
            <button class="btn-fill" id="fillBtn">📱 填入微信</button>
        </div>
    </div>

    <script src="js/bridge.js"></script>
    <script>
    (function () {
        'use strict';

        function addDanmaku(text, type) {
            type = type || 'info';
            var area = document.getElementById('dmArea');
            var ph = area.querySelector('.dm-empty');
            if (ph) ph.remove();
            var line = document.createElement('div');
            line.className = 'dm-line dm-' + type;
            var d = new Date();
            var ts = String(d.getHours()).padStart(2,'0') + ':' +
                     String(d.getMinutes()).padStart(2,'0') + ':' +
                     String(d.getSeconds()).padStart(2,'0');
            line.innerHTML = '<span class="t">[' + ts + ']</span>' + escapeHtml(text);
            area.appendChild(line);
            area.scrollTop = area.scrollHeight;
            while (area.children.length > 100) area.removeChild(area.firstChild);
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
            });
        }

        function setWechat(on) {
            var dot = document.getElementById('wxDot');
            dot.className = 'wx-dot' + (on ? ' online' : '');
        }

        // 信号：分析完成
        window.addEventListener('bridge:analysis_ready', function (e) {
            var d = (e.detail && e.detail.data) || e.detail || {};
            addDanmaku('📥 收到分析结果', 'success');
            if (d.emotion) {
                addDanmaku('情感: ' + d.emotion.label + ' (' +
                    Math.round((d.emotion.intensity||0)*100) + '%)', 'info');
            }
            var reply = d.suggested_reply || (d.llm_analysis && d.llm_analysis.reply) || '';
            var replies = d.replies || (d.llm_analysis && d.llm_analysis.replies) ||
                          (d.llm_analysis && d.llm_analysis.possible_replies) || null;
            var rt = document.getElementById('replyText');

            // 收集候选：replies 数组优先，否则单条 reply 兜底
            var candidates = [];
            if (Array.isArray(replies) && replies.length > 0) {
                candidates = replies.map(function (r) { return String(r == null ? '' : r); })
                                    .filter(function (s) { return s.trim().length > 0; });
            }
            if (candidates.length === 0 && reply) candidates = [String(reply)];

            if (candidates.length >= 3) {
                // 3 候选并排（窄窗紧凑卡片）
                rt.classList.remove('empty');
                rt.innerHTML = '';
                window._reply = candidates[0];
                var row = document.createElement('div');
                row.style.cssText = 'display:flex;gap:4px;align-items:stretch;';
                candidates.slice(0, 3).forEach(function (text, idx) {
                    var card = document.createElement('div');
                    card.style.cssText = (
                        'flex:1;min-width:0;background:rgba(18,16,14,0.55);border-left:2px solid #ff6363;'
                        + 'border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:2px;'
                    );
                    var head = document.createElement('div');
                    head.style.cssText = 'font-size:10px;color:#ff6363;font-weight:600;';
                    head.textContent = '候选' + (idx + 1);
                    var body = document.createElement('div');
                    body.style.cssText = 'font-size:11px;line-height:1.4;color:#e8dcc4;white-space:pre-wrap;word-break:break-word;flex:1;';
                    body.textContent = text;
                    var btn = document.createElement('button');
                    btn.textContent = '用这条';
                    btn.style.cssText = 'padding:2px;border:none;border-radius:6px;cursor:pointer;background:rgba(42,36,29,0.6);color:#ff8a8a;font-size:10px;';
                    btn.onclick = function () { window._reply = text; addDanmaku('已选中候选' + (idx + 1), 'info'); };
                    card.appendChild(head);
                    card.appendChild(body);
                    card.appendChild(btn);
                    row.appendChild(card);
                });
                rt.appendChild(row);
                addDanmaku('✅ 已生成 3 条候选回复', 'success');
            } else if (candidates.length > 0) {
                // 单条兜底（保持原样式）
                rt.textContent = candidates[0];
                rt.classList.remove('empty');
                window._reply = candidates[0];
                addDanmaku('✅ 已生成回复', 'success');
            }
        });

        // 信号：新消息
        window.addEventListener('bridge:new_message', function (e) {
            var d = e.detail || {};
            addDanmaku('📩 新消息 [' + (d.sender||'?') + ']: ' + (d.content||'').slice(0,40), 'warning');
        });

        // 信号：微信状态
        window.addEventListener('bridge:wechat_status', function (e) {
            setWechat(!!(e.detail && e.detail.connected));
        });

        // 填入微信
        document.getElementById('fillBtn').addEventListener('click', function () {
            var reply = window._reply || '';
            if (!reply) { addDanmaku('❌ 暂无回复内容', 'error'); return; }
            window.call('send_reply_to_wechat', reply).then(function () {
                addDanmaku('✅ 已填入微信输入框', 'success');
            }).catch(function (err) {
                addDanmaku('❌ 填入失败: ' + err.message, 'error');
            });
        });

        // 复制
        document.getElementById('copyBtn').addEventListener('click', function () {
            var reply = window._reply || '';
            if (!reply) return;
            try { navigator.clipboard.writeText(reply); } catch (e) {}
            addDanmaku('📋 已复制', 'info');
        });

        // 初始化
        window.addEventListener('bridgeReady', function () {
            window.call('get_wechat_status').then(function (s) { setWechat(!!(s && s.connected)); });
            window.call('list_persons').then(function (list) {
                if (list && list.length) {
                    document.getElementById('personName').textContent = list[0].name || '未命名';
                }
            });
        });
    })();
    </script>
</body>
</html>
