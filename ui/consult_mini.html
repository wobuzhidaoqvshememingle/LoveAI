<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LoveAI 咨询小窗</title>
    <style>
        /* 方案C 深夜书房暖琥珀 */
        :root {
            --bg-primary: #12100e;
            --bg-secondary: #1a1714;
            --bg-card: #221d18;
            --bg-hover: #2a241d;
            --text-primary: #e8dcc4;
            --text-secondary: #a89880;
            --text-muted: #6b5f4d;
            --gold-primary: #c9a36a;
            --gold-light: #e0c288;
            --gold-dark: #a8854a;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(201, 163, 106, 0.15);
            --emotion-positive: #4ade80;
            --emotion-neutral: #fbbf24;
            --emotion-negative: #f87171;
            --emotion-implied: #c084fc;
            --gradient-gold: linear-gradient(135deg, #e0c288 0%, #c9a36a 50%, #a8854a 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 340px; height: 500px;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* 顶部 Tab */
        .mini-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-gold);
        }
        .mini-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 12px;
            border-bottom: 2px solid transparent;
            transition: all 150ms ease;
        }
        .mini-tab.active {
            color: var(--gold-primary);
            border-bottom-color: var(--gold-primary);
            background: rgba(201, 163, 106, 0.08);
        }

        /* Tab 内容区 */
        .mini-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: none;
        }
        .mini-body.active { display: block; }

        /* 咨询 Tab */
        .chat-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            height: 340px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        .chat-msg { margin-bottom: 8px; line-height: 1.5; }
        .chat-msg.user { text-align: right; }
        .chat-msg.user .bubble {
            background: rgba(201, 163, 106, 0.15);
            color: var(--gold-light);
            border: 1px solid var(--border-gold);
        }
        .chat-msg.ai .bubble {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .bubble {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            max-width: 90%;
            text-align: left;
        }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            color: var(--text-primary);
            font-size: 12px;
            outline: none;
        }
        .chat-input-row input:focus { border-color: var(--gold-primary); box-shadow: 0 0 0 2px rgba(201,163,106,0.35); }
        .chat-input-row button {
            padding: 8px 12px;
            background: var(--gradient-gold);
            color: #12100e;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms ease;
        }

        /* 分析 Tab */
        .analysis-summary {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 12px;
        }
        .summary-row:last-child { border: none; }
        .summary-row .k { color: var(--text-muted); }
        .summary-row .v { color: var(--text-primary); font-weight: 600; }

        /* 好感度 Tab */
        .affection-wrap { text-align: center; padding: 10px 0; }
        .affection-ring-canvas { margin: 0 auto; }
        .dims-table {
            margin-top: 10px;
            font-size: 11px;
        }
        .dim-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 8px;
            border-bottom: 1px dotted var(--border-color);
        }
        .dim-row .dn { color: var(--text-secondary); }
        .dim-row .dv { color: var(--gold-primary); font-weight: 600; }

        /* 底部快捷按钮 */
        .mini-footer {
            display: flex;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }
        .mini-footer button {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            font-size: 11px;
            border-right: 1px solid var(--border-color);
            transition: all 150ms ease;
        }
        .mini-footer button:last-child { border-right: none; }
        .mini-footer button:hover { color: var(--gold-primary); background: rgba(201, 163, 106, 0.08); }

        .empty-tip { color: var(--text-muted); text-align: center; padding: 20px; font-size: 11px; }
    </style>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>

    <!-- 顶部 Tab -->
    <div class="mini-tabs">
        <div class="mini-tab active" data-tab="consult">💬 咨询</div>
        <div class="mini-tab" data-tab="analysis">📊 分析</div>
        <div class="mini-tab" data-tab="affection">❤️ 好感度</div>
    </div>

    <!-- 咨询 Tab -->
    <div class="mini-body active" id="body-consult">
        <div class="chat-box" id="chatBox">
            <div class="empty-tip">问我任何情感问题</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="consultInput" placeholder="输入问题...">
            <button id="consultSend">发送</button>
        </div>
    </div>

    <!-- 分析 Tab -->
    <div class="mini-body" id="body-analysis">
        <div class="analysis-summary" id="analysisSummary">
            <div class="empty-tip">暂无分析记录</div>
        </div>
    </div>

    <!-- 好感度 Tab -->
    <div class="mini-body" id="body-affection">
        <div class="affection-wrap">
            <canvas id="miniAffectionRing" width="100" height="100" class="affection-ring-canvas"></canvas>
        </div>
        <div class="dims-table" id="dimsTable">
            <div class="empty-tip">加载中...</div>
        </div>
    </div>

    <!-- 底部快捷按钮 -->
    <div class="mini-footer">
        <button id="openMainBtn">🪟 主窗口</button>
        <button id="hideBtn">➖ 隐藏</button>
        <button id="settingsBtn">⚙ 设置</button>
    </div>

    <script src="js/bridge.js"></script>
    <script>
    (function () {
        'use strict';

        // ---- Tab 切换 ----
        document.querySelectorAll('.mini-tab').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('.mini-tab').forEach(function (t) { t.classList.remove('active'); });
                document.querySelectorAll('.mini-body').forEach(function (b) { b.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById('body-' + tab.dataset.tab).classList.add('active');
                if (tab.dataset.tab === 'affection') drawRing();
            });
        });

        // ---- 咨询发送 ----
        var chatBox = document.getElementById('chatBox');
        var input = document.getElementById('consultInput');
        document.getElementById('consultSend').addEventListener('click', sendConsult);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendConsult();
        });

        function sendConsult() {
            var q = input.value.trim();
            if (!q) return;
            appendChatMsg('user', q);
            input.value = '';
            // 调用后端咨询接口（若不存在则降级 mock）
            window.call('ask_counseling', q, 'self').then(function (res) {
                var reply = (res && (res.reply || res.answer)) || '（暂无回复）';
                appendChatMsg('ai', reply);
            }).catch(function (e) {
                appendChatMsg('ai', '⚠️ 咨询失败: ' + e.message);
            });
        }

        function appendChatMsg(role, text) {
            var ph = chatBox.querySelector('.empty-tip');
            if (ph) ph.remove();
            var div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            div.innerHTML = '<span class="bubble">' + escapeHtml(text) + '</span>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
            });
        }

        // ---- 好感度环 ----
        function drawRing() {
            var canvas = document.getElementById('miniAffectionRing');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var w = canvas.width, h = canvas.height;
            var cx = w/2, cy = h/2, radius = Math.min(w,h)/2 - 6;
            var score = window._affectionTotal != null ? window._affectionTotal : 50;

            ctx.clearRect(0,0,w,h);
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            ctx.strokeStyle = '#2a241d'; ctx.lineWidth = 6; ctx.stroke();

            var grad = ctx.createLinearGradient(0,0,w,h);
            grad.addColorStop(0,'#e0c288'); grad.addColorStop(1,'#a8854a');
            ctx.beginPath();
            ctx.arc(cx, cy, radius, -Math.PI/2, -Math.PI/2 + (Math.PI*2*score/100));
            ctx.strokeStyle = grad; ctx.lineWidth = 6; ctx.lineCap='round'; ctx.stroke();

            ctx.fillStyle = '#c9a36a';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(score), cx, cy);
        }

        function loadAffection() {
            window.call('get_affection').then(function (data) {
                window._affectionTotal = (data && data.total) || 50;
                drawRing();
                // 18 维简表
                var dims = (data && data.dimensions) || [];
                var names = (data && data.dimension_names) ||
                    ['信任','依赖','亲密','激情','承诺','默契','分享欲','保护欲',
                     '安全感','归属感','好奇','欣赏','崇拜','心疼','占有欲',
                     '未来规划','生活融入','情绪共振'];
                var box = document.getElementById('dimsTable');
                if (!dims.length) { box.innerHTML = '<div class="empty-tip">暂无维度数据</div>'; return; }
                box.innerHTML = dims.map(function (v, i) {
                    return '<div class="dim-row"><span class="dn">' + (names[i] || ('维度'+(i+1))) +
                           '</span><span class="dv">' + Math.round(v) + '</span></div>';
                }).join('');
            }).catch(function () {
                document.getElementById('dimsTable').innerHTML = '<div class="empty-tip">加载失败</div>';
            });
        }

        // ---- 信号 ----
        window.addEventListener('bridge:analysis_ready', function (e) {
            var d = (e.detail && e.detail.data) || e.detail || {};
            var box = document.getElementById('analysisSummary');
            box.innerHTML =
                '<div class="summary-row"><span class="k">情感</span><span class="v">' +
                    escapeHtml(d.emotion ? d.emotion.label : '--') + '</span></div>' +
                '<div class="summary-row"><span class="k">对方意图</span><span class="v">' +
                    escapeHtml((d.llm_analysis && d.llm_analysis.intent) || '--') + '</span></div>' +
                '<div class="summary-row"><span class="k">关系阶段</span><span class="v">' +
                    escapeHtml((d.llm_analysis && d.llm_analysis.stage) || '--') + '</span></div>' +
                '<div class="summary-row"><span class="k">建议回复</span><span class="v" style="max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' +
                    escapeHtml((d.suggested_reply || '').slice(0,20)) + '</span></div>';
        });

        window.addEventListener('bridge:affection_changed', function (e) {
            var data = e.detail || {};
            if (data.total != null) { window._affectionTotal = data.total; drawRing(); }
            if (data.dimensions) loadAffection();
        });

        // ---- 底部按钮 ----
        document.getElementById('openMainBtn').addEventListener('click', function () {
            window.call('open_main_window').catch(function(){});
        });
        document.getElementById('hideBtn').addEventListener('click', function () {
            window.call('hide_mini_window').catch(function(){});
        });
        document.getElementById('settingsBtn').addEventListener('click', function () {
            window.call('open_settings').catch(function(){});
        });

        // ---- 初始化 ----
        window.addEventListener('bridgeReady', function () {
            loadAffection();
        });
        if (window.bridge && window.bridge.ready && window.bridge.ready()) {
            loadAffection();
        }
    })();
    </script>
</body>
</html>
