<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LoveAI 3D Pet</title>
<style>
  html, body {
    margin: 0; padding: 0; border: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    /* 让透明区域可以穿透鼠标到 Qt 窗口 */
  }
  #c { display: block; width: 100%; height: 100%; background: transparent; }
  #bubble {
    position: absolute;
    left: 50%;
    top: 6%;
    transform: translateX(-50%);
    max-width: 80%;
    padding: 6px 12px;
    background: rgba(255,255,255,0.95);
    color: #333;
    border: 1px solid #ccc;
    border-radius: 10px;
    font: 12px/1.4 "Microsoft YaHei", sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -8px;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(255,255,255,0.95);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubble"></div>

<script src="js/three.min.js"></script>
<script src="js/GLTFLoader.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  // 基础场景
  // ============================================================
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(0, 1.25, 4.2);
  camera.lookAt(0, 1.0, 0);

  // 灯光
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(2, 4, 3);
  scene.add(dir);
  var back = new THREE.DirectionalLight(0x88aaff, 0.25);
  back.position.set(-2, 2, -3);
  scene.add(back);

  // ============================================================
  // 程序化骨骼人形（THREE.Bone 层级 + 肢体 Box）
  // 这是真正的关节人形：旋转 Bone 即可带动对应肢体段
  // ============================================================
  var B = {}; // 骨骼字典
  var bodyGroup = new THREE.Group();
  scene.add(bodyGroup);

  function mat(color, opts) {
    opts = opts || {};
    return new THREE.MeshStandardMaterial(Object.assign(
      { color: color, roughness: 0.6, metalness: 0.1 }, opts));
  }
  var skinMat   = mat(0xffd9b3); // 皮肤（暖米肤）
  var shirtMat  = mat(0xc9a36a); // 上衣（暖琥珀）
  var pantsMat  = mat(0x2a241d); // 裤子（深棕黑）
  var shoeMat   = mat(0x3a2a1a);
  var hairMat   = mat(0x3a2a1a); // 头发（深棕）
  var eyeWhiteMat = mat(0xffffff, { roughness: 0.3 });
  var pupilMat    = mat(0x1a1a1a, { roughness: 0.2 });
  var blushMat    = mat(0xff9e9e, { roughness: 0.8, transparent: true, opacity: 0.7 });

  // 创建一根骨骼（Bone 本质是 Object3D 枢轴点），并挂一个 Box 肢体段
  // name: 骨骼名; parent: 父 Bone; pos: 关节位置（局部坐标）
  // limbGeo: BoxGeometry，meshPos: mesh 相对关节的偏移（让 Box 从关节向下延伸）
  function makeBone(name, parent, pos, limbGeo, limbMat, limbOffset) {
    var bone = new THREE.Bone();
    bone.name = name;
    bone.position.set(pos[0], pos[1], pos[2]);
    if (parent) parent.add(bone); else bodyGroup.add(bone);
    if (limbGeo) {
      var m = new THREE.Mesh(limbGeo, limbMat || skinMat);
      m.position.set(limbOffset[0], limbOffset[1], limbOffset[2]);
      bone.add(m);
    }
    B[name] = bone;
    return bone;
  }

  // 比例（Q版大头，总高约 1.9，头占比约 1/3）
  // 骨盆
  var hips = makeBone('hips', null, [0, 0.95, 0],
      new THREE.BoxGeometry(0.32, 0.20, 0.20), pantsMat, [0, 0, 0]);
  // 脊柱（缩短）
  var spine = makeBone('spine', hips, [0, 0.10, 0],
      new THREE.BoxGeometry(0.30, 0.26, 0.18), shirtMat, [0, 0.13, 0]);
  // 脖子（缩短）
  var neck = makeBone('neck', spine, [0, 0.28, 0],
      new THREE.BoxGeometry(0.09, 0.08, 0.09), skinMat, [0, 0.04, 0]);
  // 头（Q版大头：0.34 x 0.38 x 0.32）
  var head = makeBone('head', neck, [0, 0.08, 0],
      new THREE.BoxGeometry(0.34, 0.38, 0.32), skinMat, [0, 0.22, 0]);
  // 头发盖（更大更圆）
  var hair = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.14, 0.34), hairMat);
  hair.position.set(0, 0.14, -0.01);
  head.add(hair);

  // 眼睛（白眼球 + 黑瞳孔），挂在 head 骨上
  var eyeGeoWhite = new THREE.SphereGeometry(0.045, 16, 16);
  var eyeGeoPupil = new THREE.SphereGeometry(0.022, 16, 16);
  function makeEye(side) {
    var g = new THREE.Group();
    var w = new THREE.Mesh(eyeGeoWhite, eyeWhiteMat);
    var p = new THREE.Mesh(eyeGeoPupil, pupilMat);
    p.position.set(0, 0, 0.035); // 瞳孔往前突出
    g.add(w); g.add(p);
    g.position.set(side * 0.09, 0.02, 0.15);
    head.add(g);
    return g;
  }
  var eyeL = makeEye(-1);
  var eyeR = makeEye(1);

  // 腮红（两个淡粉小圆片）
  var blushGeo = new THREE.CircleGeometry(0.035, 16);
  var blushL = new THREE.Mesh(blushGeo, blushMat);
  blushL.position.set(-0.13, -0.06, 0.165);
  blushL.rotation.y = -0.2;
  head.add(blushL);
  var blushR = new THREE.Mesh(blushGeo, blushMat);
  blushR.position.set(0.13, -0.06, 0.165);
  blushR.rotation.y = 0.2;
  head.add(blushR);

  // 左臂（略短）
  var upperArmL = makeBone('upperArm_L', spine, [-0.20, 0.20, 0],
      new THREE.BoxGeometry(0.09, 0.22, 0.09), shirtMat, [0, -0.11, 0]);
  var lowerArmL = makeBone('lowerArm_L', upperArmL, [0, -0.22, 0],
      new THREE.BoxGeometry(0.075, 0.20, 0.075), skinMat, [0, -0.10, 0]);
  var handL = makeBone('hand_L', lowerArmL, [0, -0.20, 0],
      new THREE.BoxGeometry(0.09, 0.10, 0.06), skinMat, [0, -0.05, 0]);

  // 右臂
  var upperArmR = makeBone('upperArm_R', spine, [0.20, 0.20, 0],
      new THREE.BoxGeometry(0.09, 0.22, 0.09), shirtMat, [0, -0.11, 0]);
  var lowerArmR = makeBone('lowerArm_R', upperArmR, [0, -0.22, 0],
      new THREE.BoxGeometry(0.075, 0.20, 0.075), skinMat, [0, -0.10, 0]);
  var handR = makeBone('hand_R', lowerArmR, [0, -0.20, 0],
      new THREE.BoxGeometry(0.09, 0.10, 0.06), skinMat, [0, -0.05, 0]);

  // 左腿（略短）
  var upperLegL = makeBone('upperLeg_L', hips, [-0.09, -0.10, 0],
      new THREE.BoxGeometry(0.11, 0.28, 0.11), pantsMat, [0, -0.14, 0]);
  var lowerLegL = makeBone('lowerLeg_L', upperLegL, [0, -0.28, 0],
      new THREE.BoxGeometry(0.09, 0.26, 0.09), pantsMat, [0, -0.13, 0]);
  var footL = makeBone('foot_L', lowerLegL, [0, -0.26, 0],
      new THREE.BoxGeometry(0.11, 0.06, 0.18), shoeMat, [0, -0.03, 0.04]);

  // 右腿
  var upperLegR = makeBone('upperLeg_R', hips, [0.09, -0.10, 0],
      new THREE.BoxGeometry(0.11, 0.28, 0.11), pantsMat, [0, -0.14, 0]);
  var lowerLegR = makeBone('lowerLeg_R', upperLegR, [0, -0.28, 0],
      new THREE.BoxGeometry(0.09, 0.26, 0.09), pantsMat, [0, -0.13, 0]);
  var footR = makeBone('foot_R', lowerLegR, [0, -0.26, 0],
      new THREE.BoxGeometry(0.11, 0.06, 0.18), shoeMat, [0, -0.03, 0.04]);

  // 收集骨骼列表（用于调试）
  var boneNames = Object.keys(B);

  // ============================================================
  // 骨骼动画状态机
  // 每个情绪定义一组目标 rotation；update 中用 lerp 平滑过渡
  // 角度用弧度。坐标系：X=前后倾, Y=左右转, Z=左右倾
  // ============================================================
  // 基准姿势（T-pose 稍微放下手）
  var BASE = {
    upperArm_L: { x: 0, y: 0, z:  0.15 },  // 手臂自然下垂略外展
    upperArm_R: { x: 0, y: 0, z: -0.15 },
    lowerArm_L: { x: 0, y: 0, z: 0 },
    lowerArm_R: { x: 0, y: 0, z: 0 },
    upperLeg_L: { x: 0, y: 0, z: 0 },
    upperLeg_R: { x: 0, y: 0, z: 0 },
    lowerLeg_L: { x: 0, y: 0, z: 0 },
    lowerLeg_R: { x: 0, y: 0, z: 0 },
    spine:      { x: 0, y: 0, z: 0 },
    neck:       { x: 0, y: 0, z: 0 },
    head:       { x: 0, y: 0, z: 0 }
  };

  // 各情绪目标姿势（在 BASE 基础上叠加的偏移）
  var EMOTION_POSES = {
    idle:     {},
    neutral:  {},
    happy:    { upperArm_R: { x: -2.6, z: -0.4 }, lowerArm_R: { x: 0 } },
    confused: { head: { z: 0.3 }, upperArm_R: { x: -2.0, z: -0.6 }, lowerArm_R: { x: -1.2 } },
    angry:    { spine: { x: 0.15 }, lowerArm_L: { x: -1.4 }, lowerArm_R: { x: -1.4 } },
    sad:      { spine: { x: 0.35 }, head: { x: 0.35 }, upperArm_L: { z: 0.05 }, upperArm_R: { z: -0.05 } },
    shy:      { upperArm_L: { x: -1.6, z: 0.3 }, lowerArm_L: { x: -0.8 },
                upperArm_R: { x: -1.6, z: -0.3 }, lowerArm_R: { x: -0.8 } }
  };

  var currentEmotion = 'idle';
  var targetPose = {};
  function setEmotion(name) {
    if (!EMOTION_POSES.hasOwnProperty(name) && name !== 'idle' && name !== 'neutral') {
      // 未知情绪退回 idle
      name = 'idle';
    }
    currentEmotion = name;
    // 合并 BASE + 情绪偏移
    var pose = {};
    for (var k in BASE) {
      pose[k] = { x: BASE[k].x, y: BASE[k].y, z: BASE[k].z };
    }
    var off = EMOTION_POSES[name] || {};
    for (var k2 in off) {
      pose[k2].x += off[k2].x || 0;
      pose[k2].y += off[k2].y || 0;
      pose[k2].z += off[k2].z || 0;
    }
    targetPose = pose;
  }

  // reminder：一次性跳一下
  var reminderT = -1; // <0 表示未激活
  function playReminder() {
    reminderT = 0;
  }

  // ============================================================
  // 动画循环
  // ============================================================
  var clock = new THREE.Clock();
  var bubbleEl = document.getElementById('bubble');
  var bubbleTimer = null;

  function showBubble(text) {
    if (!text) return;
    var t = String(text).slice(0, 30);
    bubbleEl.textContent = t;
    bubbleEl.classList.add('show');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () {
      bubbleEl.classList.remove('show');
    }, 3000);
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;
    var LERP = 0.12; // 平滑插值系数

    // 逐骨骼应用目标姿势（lerp 平滑）
    for (var name in targetPose) {
      var bone = B[name];
      if (!bone) continue;
      var tp = targetPose[name];
      bone.rotation.x = lerp(bone.rotation.x, tp.x, LERP);
      bone.rotation.y = lerp(bone.rotation.y, tp.y, LERP);
      bone.rotation.z = lerp(bone.rotation.z, tp.z, LERP);
    }

    // ---- 动态叠加（呼吸/眨眼/动作摆动）----
    // 呼吸：身体轻微上下浮动 + spine 微缩放（Q版幅度加大）
    var breath = Math.sin(t * 2.0) * 0.025;
    bodyGroup.position.y = breath;

    // idle/happy 时手臂轻微摆动
    if (currentEmotion === 'happy') {
      // 右手挥动：在目标姿势上叠加摆动
      B.lowerArm_R.rotation.x = targetPose.lowerArm_R.x + Math.sin(t * 8) * 0.4;
      // 轻跳
      bodyGroup.position.y += Math.abs(Math.sin(t * 3)) * 0.06;
    }
    if (currentEmotion === 'shy') {
      // 左右轻摇
      bodyGroup.rotation.z = Math.sin(t * 2.5) * 0.05;
    } else {
      bodyGroup.rotation.z = lerp(bodyGroup.rotation.z, 0, 0.1);
    }
    if (currentEmotion === 'angry') {
      // 轻微跺脚
      bodyGroup.position.y += Math.abs(Math.sin(t * 6)) * 0.03;
    }

    // 眨眼：周期性把眼睛 scaleY 压到 0.1（Q版真实眨眼）
    var blinkCycle = (t % 3.6);
    var eyeScaleY = 1.0;
    if (blinkCycle < 0.14) {
      // 快速闭眼：用余弦压下去再起来
      var k = 1.0 - Math.abs(blinkCycle - 0.07) / 0.07;
      eyeScaleY = 1.0 - Math.max(0, k) * 0.9;
    }
    eyeL.scale.y = eyeScaleY;
    eyeR.scale.y = eyeScaleY;

    // reminder 一次性跳跃 + 挥手
    if (reminderT >= 0) {
      reminderT += dt;
      var rt = reminderT;
      if (rt < 0.6) {
        // 抛物线跳
        var jumpH = Math.sin((rt / 0.6) * Math.PI) * 0.25;
        bodyGroup.position.y += jumpH;
        // 挥手
        B.upperArm_R.rotation.x = -2.8;
        B.lowerArm_R.rotation.x = Math.sin(rt * 20) * 0.6;
      } else {
        reminderT = -1;
      }
    }

    renderer.render(scene, camera);
  }

  // ============================================================
  // 尺寸自适应
  // ============================================================
  function resize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ============================================================
  // GLTF 模型替换接口（可选，失败则保留程序化人形）
  // ============================================================
  var mixer = null;
  var gltfActions = {};
  function tryLoadGLTF() {
    if (typeof THREE.GLTFLoader === 'undefined') return;
    try {
      var loader = new THREE.GLTFLoader();
      // HTML 在 ui/ 下，assets 在项目根，需要 ../assets/3d/pet.glb
      loader.load('../assets/3d/pet.glb', function (gltf) {
        // 隐藏程序化人形
        bodyGroup.visible = false;
        var model = gltf.scene;
        model.scale.setScalar(1.0);
        scene.add(model);

        mixer = new THREE.AnimationMixer(model);
        (gltf.animations || []).forEach(function (clip) {
          var lower = clip.name.toLowerCase();
          var action = mixer.clipAction(clip);
          gltfActions[lower] = action;
        });
        // 播放默认动画
        var first = gltf.animations && gltf.animations[0];
        if (first) mixer.clipAction(first).play();
        console.log('[pet3d] GLTF 模型加载成功，动画数:', (gltf.animations||[]).length);
      }, undefined, function (err) {
        console.log('[pet3d] 无 GLTF 模型，使用程序化人形:', err);
      });
    } catch (e) {
      console.log('[pet3d] GLTF 加载异常，使用程序化人形:', e);
    }
  }

  // 情绪切换时如果有 GLTF 模型，尝试匹配动画
  var origSetEmotion = window.setEmotion;
  function applyEmotionToGLTF(name) {
    if (!mixer) return;
    var map = {
      idle: 'idle', neutral: 'idle',
      happy: 'wave', confused: 'confused',
      angry: 'angry', sad: 'sad', shy: 'shy'
    };
    var target = map[name] || 'idle';
    // 停止所有 action
    for (var k in gltfActions) gltfActions[k].stop();
    var act = gltfActions[target] || gltfActions[name] || gltfActions['idle'];
    if (act) { act.reset().fadeIn(0.2).play(); }
  }

  // ============================================================
  // 暴露全局接口
  // ============================================================
  window.setEmotion = function (name) {
    setEmotion(name);
    applyEmotionToGLTF(name);
  };
  window.showBubble = showBubble;
  window.playReminder = playReminder;

  // 点击事件钩子：后端（QWebChannel / JS 注入）可覆写 window.pet_on_click
  // 默认空实现，避免无桥接时报错
  window.pet_on_click = window.pet_on_click || function () {};
  document.addEventListener('click', function () {
    try { window.pet_on_click(); } catch (e) { /* 桥接未就绪则忽略 */ }
  });

  // 启动
  setEmotion('idle');
  tryLoadGLTF();
  animate();

  // 暴露骨骼数给调试
  window.__petBoneCount = boneNames.length;
  window.__petBoneNames = boneNames;
})();
</script>
</body>
</html>
